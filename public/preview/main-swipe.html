<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalyst Swipe</title><link rel="stylesheet" href="style.css"><style>
.deck{position:relative;margin:4px 20px 0;height:510px}
.cd{position:absolute;inset:0;background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 18px 40px -18px rgba(0,0,0,.35)}
.cd.b2{transform:translateY(22px) scale(.92);opacity:.5}
.cd.b1{transform:translateY(11px) scale(.96);opacity:.85}
.cd.f{transform:translateX(6px) rotate(3deg);transform-origin:50% 50%}
.cd .ph{height:240px}
.stamp{position:absolute;top:26px;padding:6px 12px;border:2.5px solid;font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase;border-radius:8px}
.save{left:20px;transform:rotate(-14deg);background:#fff;color:var(--ink);border-color:var(--ink)}
.pass{right:18px;top:56px;color:#fff;border-color:#fff;opacity:.25;transform:rotate(12deg)}
.bd{padding:16px 18px 0}
.terms{grid-template-columns:repeat(4,1fr);margin-top:14px}
.terms>div:not(:nth-child(3n+1)){padding-left:0;border-left:0}
.terms>div+div{padding-left:10px!important;border-left:1px solid var(--line)!important}
.terms b{font-size:15px}
.acts{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:26px}
.rb{border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:#fff}
.rb svg{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hint{display:flex;justify-content:space-between;padding:0 28px;margin-top:8px;font:500 10px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.ph-sole{background:radial-gradient(ellipse 60% 22% at 50% 72%,#2c2c2c,transparent 70%),radial-gradient(ellipse 34% 14% at 50% 52%,#e9e9e6 0 60%,transparent 62%),linear-gradient(#151515,#0b0b0b)}
</style></head><body><div class="phone" style="height:844px"><div class="status"><span>9:41</span><span style="display:flex;gap:6px;align-items:center"><svg width="18" height="11"><rect x="0" y="7" width="3" height="4"/><rect x="5" y="5" width="3" height="6"/><rect x="10" y="2" width="3" height="9"/><rect x="15" y="0" width="3" height="11"/></svg><svg width="25" height="12"><rect x=".5" y=".5" width="21" height="11" rx="3" fill="none" stroke="#000"/><rect x="2.5" y="2.5" width="16" height="7" rx="1.5"/><rect x="23" y="4" width="2" height="4" rx="1"/></svg></span></div><div class="top"><div class="logo">catalyst<i></i></div><div class="chip" style="padding:6px 12px;font-size:12px">For you &#9662;</div></div><div class="deck"><div class="cd b2"></div><div class="cd b1"></div>
