<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome · Catalyst preview</title><link rel="stylesheet" href="style.css"><style>
.o{padding:0 24px}
.steps{display:flex;gap:4px;padding:6px 24px 0}.steps i{flex:1;height:2px;background:var(--line)}.steps i.on{background:var(--ink)}
.nav{display:flex;justify-content:space-between;align-items:center;padding:14px 24px 0;height:58px}
.back{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center}
.back svg,.ico{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.t{font-size:34px;line-height:1;letter-spacing:-.045em;font-weight:700;margin:26px 0 10px}
.s{color:var(--mute);font-size:15px;line-height:1.45}
.foot{position:absolute;left:24px;right:24px;bottom:34px}
.field{border-bottom:1px solid var(--ink);padding:14px 0 10px;font-size:20px;display:flex;gap:10px;align-items:center}
.or{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:12px;margin:22px 0}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.btn svg{margin-right:10px}
.fine{font-size:12px;color:var(--mute);line-height:1.45;text-align:center;margin-top:14px}
.u{text-decoration:underline;text-underline-offset:3px}
.code{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:34px 0 18px}
.code div{height:60px;border-bottom:1.5px solid var(--line);display:grid;place-items:center;font-size:30px}
.code .f{border-color:var(--ink)}.code .cur:after{content:"";width:1.5px;height:30px;background:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:24px}
.int{border:1px solid var(--line);padding:14px;height:84px;display:flex;flex-direction:column;justify-content:space-between;font-weight:600;font-size:15px}
.int .ico{width:22px;height:22px}
.int.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-top:1px solid var(--line);font-size:15px}
.opt:last-child{border-bottom:1px solid var(--line)}
.rad{width:20px;height:20px;border:1.5px solid var(--line);border-radius:50%}
.opt.on .rad{border:6px solid var(--ink)}.opt.on{font-weight:600}
.lim{background:var(--ink);color:#fff;padding:16px 18px;margin-top:16px}
.lim b{display:block;white-space:nowrap;font-size:30px;font-weight:500;letter-spacing:-.04em;margin:6px 0 8px}
.lim p{font-size:13px;line-height:1.45;color:#bdbdbd}
.rk{display:flex;gap:16px;padding:18px 0;border-top:1px solid var(--line)}
.rk .n{font-size:12px;color:var(--mute);padding-top:3px}
.rk h3{font-size:18px;letter-spacing:-.02em;margin-bottom:4px}.rk p{font-size:14px;color:var(--mute);line-height:1.45}
.chk{display:flex;gap:12px;font-size:14px;line-height:1.4;align-items:flex-start;margin-bottom:14px}
.box{flex:none;width:20px;height:20px;border-radius:4px;display:grid;place-items:center;background:var(--ink)}
</style></head><body><div class="phone" style="background:#0b0b0b;color:#fff"><div class="status"><span>9:41</span><span style="display:flex;gap:6px;align-items:center"><svg fill="#fff" width="18" height="11"><rect x="0" y="7" width="3" height="4"/><rect x="5" y="5" width="3" height="6"/><rect x="10" y="2" width="3" height="9"/><rect x="15" y="0" width="3" height="11"/></svg><svg fill="#fff" width="25" height="12"><rect x=".5" y=".5" width="21" height="11" rx="3" fill="none" stroke="#fff"/><rect x="2.5" y="2.5" width="16" height="7" rx="1.5"/><rect x="23" y="4" width="2" height="4" rx="1"/></svg></span></div>
<div class="photo" style="position:absolute;inset:0;background-image:url(img/S0002.jpg);opacity:.55"></div>
<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,11,.35) 0%,rgba(11,11,11,.1) 35%,#0b0b0b 72%)"></div>
<div style="position:relative;padding:14px 24px"><div class="logo" style="color:#fff">catalyst<i style="background:#fff"></i></div></div>
<div style="position:absolute;left:24px;right:24px;bottom:34px">
<div class="lbl" style="color:#9a9a9a;margin-bottom:14px">Catalyst community, NYC</div>
<h1 style="font-size:52px;line-height:.94;letter-spacing:-.055em;font-weight:700">Startup ownership for everyone.</h1>
<p style="font-size:17px;color:#bdbdbd;margin:14px 0 30px">Right from your phone.</p>
<div class="btn" style="background:#fff;color:#0b0b0b">Get started</div>
<div class="btn ghost" style="color:#fff;border-color:#555;margin-top:10px">I have an account</div>
</div></div></body></html>
