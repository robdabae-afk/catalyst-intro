<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><style>
.pad{padding:0 20px}
.amt{font-size:68px;font-weight:500;letter-spacing:-.05em;text-align:center;margin:30px 0 6px}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:22px 0}
.presets div{border:1px solid var(--line);text-align:center;padding:12px 0;border-radius:999px;font-size:14px}
.presets .on{border-color:var(--ink);background:var(--ink);color:#fff}
.chk{display:flex;gap:12px;font-size:14px;line-height:1.4;padding:12px 0;border-top:1px solid var(--line)}
.box{flex:none;width:20px;height:20px;border:1.5px solid var(--ink);border-radius:4px;display:grid;place-items:center;font-size:12px;background:var(--ink);color:#fff}
</style></head><body><div class="phone">
<div class="status"><span>9:41</span><span style="display:flex;gap:6px;align-items:center"><svg width="18" height="11"><rect x="0" y="7" width="3" height="4"/><rect x="5" y="5" width="3" height="6"/><rect x="10" y="2" width="3" height="9"/><rect x="15" y="0" width="3" height="11"/></svg><svg width="25" height="12"><rect x=".5" y=".5" width="21" height="11" rx="3" fill="none" stroke="#000"/><rect x="2.5" y="2.5" width="16" height="7" rx="1.5"/><rect x="23" y="4" width="2" height="4" rx="1"/></svg></span></div>
<div class="top"><div class="ic">←</div><div style="font-size:14px;font-weight:600">Stoop Coffee Co. <span class="sample" style="margin-left:4px">Sample</span></div><div class="lbl">1 / 3</div></div>
<div class="pad"><div class="bar" style="height:2px"><span style="width:33%"></span></div>
<div class="amt num">$250</div><p style="text-align:center;color:var(--mute);font-size:14px">SAFE at a $6M valuation cap</p>
<div class="presets num"><div>$100</div><div class="on">$250</div><div>$500</div><div>$1K</div></div>
<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--mute);padding-bottom:16px"><span>Your 12-month limit</span><span class="num" style="color:var(--ink)">$2,500 left</span></div>
<div class="chk"><span class="box">✓</span><span>I could lose all of this money.</span></div>
<div class="chk"><span class="box">✓</span><span>I may not be able to sell for years.</span></div>
<div class="chk" style="border-bottom:1px solid var(--line)"><span class="box" style="background:#fff"></span><span>I've read the <span style="text-decoration:underline">company's filing</span>.</span></div>
<p style="font-size:12px;color:var(--mute);margin-top:14px;line-height:1.4">If the goal isn't hit by Oct 24, you get your full $250 back.</p>
</div>
<div style="position:absolute;left:20px;right:20px;bottom:34px"><div class="btn" style="opacity:.35">Continue</div></div>
</div></body></html>
